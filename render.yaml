services:
  # Web Application & API Backend
  - type: web
    name: jvk-commerce-portal
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Connects automatically to Render PostgreSQL if provisioned:
      - key: DATABASE_URL
        fromDatabase:
          name: jvk-commerce-db
          property: connectionString

# Managed PostgreSQL Database on Render (Optional)
databases:
  - name: jvk-commerce-db
    databaseName: jvk_commerce
    user: jvk_user
    plan: free
    region: oregon
